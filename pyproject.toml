[project]
name = "toty-webui"
version = "0.1"
description = "Gradio web frontend for a remote Ollama host"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.14.4",
    "gradio>=5.0.0",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
]

[project.scripts]
toty-webui = "toty_webui.app:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["toty_webui*"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
